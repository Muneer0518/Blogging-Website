name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop  # Deploy when you push to the 'develop' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository to get your code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (for Parcel build)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # You can change the version if needed

      # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: npm install  # This installs any packages if needed

      # Step 4: Build the project (this creates the 'dist/' folder with final files)
      - name: Build project
        run: npx parcel build src/index.html  # This will output to 'dist/' folder by default

      # Step 5: Deploy the files to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          branch: gh-pages  # This is the branch to deploy to (can be 'gh-pages')
          folder: dist  # Make sure to point to the 'dist/' folder, where Parcel outputs the files
