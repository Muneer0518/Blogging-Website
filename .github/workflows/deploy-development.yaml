name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop  # Deploy when you push to the 'develop' branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository to get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js (for Parcel build)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can change the version if needed

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install  # This installs necessary packages

      # Step 4: Build the project (this creates the 'dist/' folder)
      - name: Build project
        run: npx parcel build src/index.html --dist-dir dist  # Outputs files to 'dist/' folder

      # Step 5: Upload the built files as an artifact for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Upload everything in the 'dist/' folder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
